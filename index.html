<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="皮克敏儲蓄">
    
    <title>🌸 Pikmin Bloom 365日儲蓄遠征隊</title>
    <style>
        :root {
            --bloom-green: #4caf50;
            --bloom-light-green: #e8f5e9;
            --bloom-bg: #f7f9f6;
            --text-main: #2d3748;
            --card-shadow: 0 10px 30px rgba(140, 160, 140, 0.08);
            
            /* 皮克敏格仔儲滿後的色系 */
            --p-yellow: #fef08a;
            --p-red: #fca5a5;
            --p-blue: #93c5fd;
            --p-purple: #e9d5ff;
            --p-white: #f1f5f9;
            --p-rock: #cbd5e1;
            --p-winged: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bloom-bg);
            color: var(--text-main);
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            background: #ffffff;
            max-width: 460px;
            width: 100%;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            padding: 20px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            color: #1b4332;
        }

        .subtitle {
            font-size: 12px;
            color: #718096;
            margin-top: 2px;
        }

        /* 儲蓄進度看板面版 */
        .dashboard-panel {
            background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .amount-display {
            font-size: 26px;
            font-weight: 900;
            color: #1e3a1e;
            margin-bottom: 2px;
        }

        .amount-total {
            font-size: 15px;
            font-weight: normal;
            color: #a0aec0;
        }

        /* 新增：日數統計樣式 */
        .days-display {
            font-size: 14px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 10px;
            background: rgba(76, 175, 80, 0.1);
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
        }

        /* 進度條 */
        .progress-container {
            background: #edf2f7;
            border-radius: 999px;
            height: 12px;
            width: 100%;
            position: relative;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #66bb6a, #43a047);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s ease;
            position: relative;
        }

        .progress-flower {
            position: absolute;
            right: -10px;
            top: -6px;
            font-size: 16px;
        }

        .status-msg {
            font-size: 13px;
            color: #4a5568;
            font-weight: 600;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            display: inline-block;
            width: 100%;
        }

        /* 控制按鈕區 */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-main-whistle {
            grid-column: span 2;
            background: #2e7d32;
            color: #ffffff;
            padding: 12px;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            padding: 10px;
        }

        .btn-action-confirm {
            background: #ff9800;
            color: white;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.15);
        }

        .btn-action-confirm:disabled, .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-danger-reset {
            background: #fff5f5;
            color: #e53e3e;
            border: 1px dashed #feb2b2;
        }

        /* 數字格仔溫室區 */
        .greenhouse-box {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px;
            background: #fafafa;
            scroll-behavior: smooth;
        }

        .greenhouse-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .grid-cell {
            background: #ffffff;
            border: 1px solid #edf2f7;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #718096;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .grid-cell:hover:not(.locked) {
            border-color: #4caf50;
            background: var(--bloom-light-green);
            color: #2e7d32;
        }

        .grid-cell.active-seeking {
            border-color: #ff9800;
            background: #fffbeb;
            color: #b45309;
            box-shadow: 0 0 0 3px #ffe0b2;
            animation: cell-bounce 0.4s infinite alternate;
        }

        @keyframes cell-bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        /* 已儲蓄格仔樣式 */
        .grid-cell.locked { cursor: not-allowed; color: #2d3748; border: none; }
        .grid-cell.p-yellow { background: #fef08a; box-shadow: inset 0 -3px 0 #facc15; }
        .grid-cell.p-red { background: #fca5a5; box-shadow: inset 0 -3px 0 #f87171; }
        .grid-cell.p-blue { background: #93c5fd; box-shadow: inset 0 -3px 0 #60a5fa; }
        .grid-cell.p-purple { background: #e9d5ff; box-shadow: inset 0 -3px 0 #c084fc; }
        .grid-cell.p-white { background: #f1f5f9; box-shadow: inset 0 -3px 0 #cbd5e1; border: 1px solid #e2e8f0; }
        .grid-cell.p-rock { background: #cbd5e1; box-shadow: inset 0 -3px 0 #94a3b8; }
        .grid-cell.p-winged { background: #fbcfe8; box-shadow: inset 0 -3px 0 #f472b6; }

        .badge-icon {
            font-size: 11px;
            margin-top: 1px;
        }

        .hidden-node {
            display: none !important;
        }

        .btn-toggle-view {
            background: none;
            color: #4caf50;
            font-size: 13px;
            font-weight: 700;
            width: 100%;
            padding: 8px 0 0 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Pikmin Bloom 儲蓄遠征隊</h1>
        <div class="subtitle">培育 365 隻皮克敏・挑戰 $66,795 目標</div>
    </header>

    <div class="dashboard-panel">
        <div class="amount-display">
            <span id="txt-saved">$0</span> <span class="amount-total">/ $66,795</span>
        </div>
        <div class="days-display">
            📅 已堅持遠征：<span id="txt-days">0</span> / 365 日
        </div>
        <div class="progress-container">
            <div id="progress-juice" class="progress-fill">
                <span id="progress-flower" class="progress-flower">🌸</span>
            </div>
        </div>
        <div id="status-msg" class="status-msg">💡 吹響哨子或直接點選下方格仔開始！</div>
    </div>

    <div class="button-group">
        <button id="btn-whistle" class="btn-main-whistle" onclick="triggerWhistle()">🎲 吹哨子集合 (隨機抽取金額)</button>
        <button id="btn-retry" class="btn-secondary" onclick="retrySearch()" disabled>重新抽取</button>
        <button id="btn-save" class="btn-action-confirm" onclick="confirmToOnion()" disabled>完成儲蓄 (累加金額)</button>
        <button id="btn-undo" class="btn-secondary" onclick="undoLast()">↩️ 撤銷上一筆</button>
        <button id="btn-reset" class="btn-danger-reset" onclick="resetAdventure()">🗑️ 全部清空重置</button>
    </div>

    <div class="greenhouse-box" id="scroll-box">
        <div class="greenhouse-grid" id="node-grid"></div>
    </div>

    <button id="btn-toggle" class="btn-toggle-view" onclick="toggleView()">🌿 展示全部 (目前隱藏部分)</button>
</div>

<script>
    const MAX_DAYS = 365;
    const TOTAL_TARGET = 66795;
    
    const KINDS = [
        { class: 'p-yellow', icon: '🟡', name: '黃色皮克敏' },
        { class: 'p-red', icon: '🔴', name: '紅色皮克敏' },
        { class: 'p-blue', icon: '🔵', name: '藍色皮克敏' },
        { class: 'p-purple', icon: '🟣', name: '紫色皮克敏' },
        { class: 'p-white', icon: '⚪', name: '白色皮克敏' },
        { class: 'p-rock', icon: '🪨', name: '岩石皮克敏' },
        { class: 'p-winged', icon: '🌸', name: '羽翼皮克敏' }
    ];

    let savedList = [];
    try {
        savedList = JSON.parse(localStorage.getItem('pikmin_bloom_final_saved')) || [];
        if (!Array.isArray(savedList)) savedList = [];
    } catch(e) {
        savedList = [];
    }

    let activeSelection = null;
    let expandedState = false;

    const gridLayout = document.getElementById('node-grid');
    
    function buildGrid() {
        if (!gridLayout) return;
        gridLayout.innerHTML = '';
        
        for (let i = 1; i <= MAX_DAYS; i++) {
            const cell = document.createElement('div');
            cell.id = `node-${i}`;
            cell.className = 'grid-cell';
            
            const kindType = KINDS[(i - 1) % KINDS.length];
            cell.innerHTML = `<div>${i}</div>`;

            if (savedList.includes(i)) {
                cell.classList.add('locked', kindType.class);
                cell.innerHTML += `<div class="badge-icon">${kindType.icon}</div>`;
            }
            
            if (i > 50 && !expandedState) {
                cell.classList.add('hidden-node');
            }

            cell.onclick = () => tapCell(i);
            gridLayout.appendChild(cell);
        }
        refreshPanel();
    }

    function refreshPanel() {
        // 更新金額
        const currentSum = savedList.reduce((acc, val) => acc + val, 0);
        document.getElementById('txt-saved').innerText = `$${currentSum.toLocaleString()}`;
        
        // 更新日數統計
        document.getElementById('txt-days').innerText = savedList.length;
        
        // 更新進度條
        const ratio = (currentSum / TOTAL_TARGET) * 100;
        document.getElementById('progress-juice').style.width = `${Math.min(ratio, 100)}%`;

        const flower = document.getElementById('progress-flower');
        if (ratio >= 100) flower.innerText = '🌻';
        else if (ratio >= 50) flower.innerText = '🌹';
        else flower.innerText = '🌸';

        const retryBtn = document.getElementById('btn-retry');
        const saveBtn = document.getElementById('btn-save');
        const statusMsg = document.getElementById('status-msg');

        if (activeSelection !== null) {
            retryBtn.disabled = false;
            saveBtn.disabled = false;
            const kIdx = (activeSelection - 1) % KINDS.length;
            const kName = KINDS[kIdx].name;
            const kIcon = KINDS[kIdx].icon;
            statusMsg.innerHTML = `🎯 已選取金額：<b>$${activeSelection}</b> (${kIcon}${kName})`;
        } else {
            retryBtn.disabled = true;
            saveBtn.disabled = true;
            if(savedList.length === 0) {
                statusMsg.innerHTML = `💡 吹響哨子或直接點選下方格仔開始！`;
            } else {
                statusMsg.innerHTML = `✨ 已成功培育 ${savedList.length} 隻皮克敏，繼續加油！`;
            }
        }
        
        const toggleBtn = document.getElementById('btn-toggle');
        if (expandedState) {
            toggleBtn.innerText = '🌿 收回部分格仔 (只顯示 1-50)';
        } else {
            toggleBtn.innerText = `🌿 展示全部 365 格 (目前只顯示 1-50)`;
        }
    }

    function tapCell(id) {
        if (savedList.includes(id)) return;
        
        if (activeSelection !== null) {
            const prevCell = document.getElementById(`node-${activeSelection}`);
            if (prevCell) prevCell.classList.remove('active-seeking');
        }

        activeSelection = id;
        const currentCell = document.getElementById(`node-${activeSelection}`);
        if (currentCell) currentCell.classList.add('active-seeking');
        refreshPanel();
    }

    function triggerWhistle() {
        let pool = [];
        for (let i = 1; i <= MAX_DAYS; i++) {
            if (!savedList.includes(i)) pool.push(i);
        }

        if (pool.length === 0) {
            alert('🌸 恭喜！365隻皮克敏全體滿開，儲蓄挑戰完美全破！🎉');
            return;
        }

        const picked = pool[Math.floor(Math.random() * pool.length)];

        if (picked > 50 && !expandedState) {
            toggleView();
        }

        tapCell(picked);

        setTimeout(() => {
            const target = document.getElementById(`node-${picked}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    function retrySearch() {
        if (activeSelection !== null) {
            const cell = document.getElementById(`node-${activeSelection}`);
            if (cell) cell.classList.remove('active-seeking');
            activeSelection = null;
            refreshPanel();
        }
    }

    function confirmToOnion() {
        if (activeSelection === null) return;

        savedList.push(activeSelection);
        localStorage.setItem('pikmin_bloom_final_saved', JSON.stringify(savedList));

        activeSelection = null;
        buildGrid();
    }

    function undoLast() {
        if (savedList.length === 0) {
            alert('目前小隊裏面沒有任何儲蓄紀錄可以撤銷！');
            return;
        }
        
        const popped = savedList.pop();
        localStorage.setItem('pikmin_bloom_final_saved', JSON.stringify(savedList));
        
        activeSelection = null;
        buildGrid();
        alert Levant(`↩️ 已成功撤銷上一次儲蓄：$${popped}，金額已扣回。`);
    }

    function resetAdventure() {
        const verify = confirm('⚠️ 確定要全部清空重置嗎？\n現時所有儲蓄進度會歸零，且無法復原！');
        if (verify) {
            savedList = [];
            activeSelection = null;
            localStorage.setItem('pikmin_bloom_final_saved', JSON.stringify(savedList));
            expandedState = false;
            buildGrid();
            document.getElementById('scroll-box').scrollTop = 0;
            alert('🗑️ 紀錄已清空！新一輪挑戰開始，一齊加油！💰');
        }
    }

    function toggleView() {
        expandedState = !expandedState;
        
        for (let i = 51; i <= MAX_DAYS; i++) {
            const node = document.getElementById(`node-${i}`);
            if (node) {
                if (expandedState) node.classList.remove('hidden-node');
                else node.classList.add('hidden-node');
            }
        }
        refreshPanel();
        if (!expandedState) {
            document.getElementById('scroll-box').scrollTop = 0;
        }
    }

    buildGrid();
</script>

</body>
</html>
